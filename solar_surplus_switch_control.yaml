blueprint:
  name: PV Surplus Heat Pump Controller
  description: >
    光伏盈余自动控制热泵烧热水。当电网功率低于启动阈值（即卖电足够多）
    持续指定时间后开启热泵；当电网功率高于关闭阈值（即盈余不足）
    持续指定时间后关闭热泵。通过 input_boolean 跟踪状态，避免重复触发。
  domain: automation
  input:
    grid_power_sensor:
      name: 电网功率传感器
      description: 负值表示向电网送电（光伏盈余），正值表示从电网取电
      selector:
        entity:
          domain: sensor

    heat_pump_switch:
      name: 热泵控制开关
      description: 控制热泵启停的开关实体（toggle 一次切换状态）
      selector:
        entity:
          domain: switch

    state_tracker:
      name: 状态跟踪开关
      description: 一个 input_boolean，用于记录热泵当前状态，需预先在帮助者中创建
      selector:
        entity:
          domain: input_boolean

    turn_on_threshold:
      name: 启动阈值 (W)
      description: 电网功率低于此值（即卖电功率大于此值）时开启热泵
      default: -200
      selector:
        number:
          min: -5000
          max: 0
          step: 10
          unit_of_measurement: W

    turn_off_threshold:
      name: 关闭阈值 (W)
      description: 电网功率高于此值（即卖电功率小于此值）时关闭热泵
      default: -10
      selector:
        number:
          min: -5000
          max: 0
          step: 10
          unit_of_measurement: W

    trigger_duration:
      name: 触发持续时间 (秒)
      description: 功率越过阈值后需持续多久才执行动作，防止频繁启停
      default: 60
      selector:
        number:
          min: 5
          max: 600
          step: 5
          unit_of_measurement: seconds

mode: single
trigger:
  - platform: numeric_state
    entity_id: !input grid_power_sensor
    below: !input turn_on_threshold
    for:
      seconds: !input trigger_duration
    id: surplus_on
  - platform: numeric_state
    entity_id: !input grid_power_sensor
    above: !input turn_off_threshold
    for:
      seconds: !input trigger_duration
    id: surplus_off

action:
  - variables:
      switch_entity: !input heat_pump_switch
      tracker_entity: !input state_tracker
  - choose:
      - conditions:
          - condition: trigger
            id: surplus_on
        sequence:
          - if:
              - condition: state
                entity_id: !input state_tracker
                state: "off"
            then:
              - service: switch.toggle
                target:
                  entity_id: "{{ switch_entity }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: "{{ tracker_entity }}"

      - conditions:
          - condition: trigger
            id: surplus_off
        sequence:
          - if:
              - condition: state
                entity_id: !input state_tracker
                state: "on"
            then:
              - service: switch.toggle
                target:
                  entity_id: "{{ switch_entity }}"
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ tracker_entity }}"
