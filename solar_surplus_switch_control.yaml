alias: 光伏盈余控制热泵
description: 卖电 > 200W 时点击一次开启热泵，卖电 < 10W 时点击一次关闭热泵
triggers:
  - entity_id:
      - sensor.ecomain_003516000993_local_main_all_power_rt
    below: -200
    for:
      seconds: 60
    id: surplus_on
    trigger: numeric_state
  - entity_id:
      - sensor.ecomain_003516000993_local_main_all_power_rt
    above: -10
    for:
      seconds: 60
    id: surplus_off
    trigger: numeric_state
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: surplus_on
        sequence:
          - if:
              - condition: state
                entity_id: input_boolean.heat_pump_state
                state: "off"
            then:
              - service: switch.toggle
                target:
                  entity_id: switch.adp_cn_1208742996_adfbt6_switch_a_p_3_1
                data: {}
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.heat_pump_state
                data: {}
      - conditions:
          - condition: trigger
            id: surplus_off
        sequence:
          - if:
              - condition: state
                entity_id: input_boolean.heat_pump_state
                state: "on"
            then:
              - service: switch.toggle
                target:
                  entity_id: switch.adp_cn_1208742996_adfbt6_switch_a_p_3_1
                data: {}
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.heat_pump_state
                data: {}
mode: single
