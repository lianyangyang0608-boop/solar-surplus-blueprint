blueprint:
  name: PV Surplus Heat Pump Controller
  description: >
    Automatically run your heat pump water heater on solar surplus.
    Turns on when grid power drops below the ON threshold (exporting enough),
    turns off when grid power rises above the OFF threshold (surplus gone).
    Uses an input_boolean to track state and avoid repeated toggling.
  domain: automation
  input:
    grid_power_sensor:
      name: Grid Power Sensor
      description: Negative means exporting to grid (solar surplus), positive means importing.
      selector:
        entity:
          domain: sensor

    heat_pump_switch:
      name: Heat Pump Switch
      description: Switch entity that toggles the heat pump on/off.
      selector:
        entity:
          domain: switch

    state_tracker:
      name: State Tracker
      description: An input_boolean to remember whether the heat pump is currently on. Create one in Helpers first.
      selector:
        entity:
          domain: input_boolean

    turn_on_threshold:
      name: Turn On Threshold (W)
      description: Grid power below this value (exporting more than this) turns the heat pump on.
      default: -200
      selector:
        number:
          min: -5000
          max: 0
          step: 10
          unit_of_measurement: W

    turn_off_threshold:
      name: Turn Off Threshold (W)
      description: Grid power above this value (surplus too low) turns the heat pump off.
      default: -10
      selector:
        number:
          min: -5000
          max: 0
          step: 10
          unit_of_measurement: W

    trigger_duration:
      name: Trigger Duration (seconds)
      description: How long the threshold must be crossed before acting, prevents rapid toggling.
      default: 60
      selector:
        number:
          min: 5
          max: 600
          step: 5
          unit_of_measurement: seconds

mode: single
trigger:
  - platform: numeric_state
    entity_id: !input grid_power_sensor
    below: !input turn_on_threshold
    for:
      seconds: !input trigger_duration
    id: surplus_on
  - platform: numeric_state
    entity_id: !input grid_power_sensor
    above: !input turn_off_threshold
    for:
      seconds: !input trigger_duration
    id: surplus_off

action:
  - variables:
      switch_entity: !input heat_pump_switch
      tracker_entity: !input state_tracker
  - choose:
      - conditions:
          - condition: trigger
            id: surplus_on
        sequence:
          - if:
              - condition: state
                entity_id: !input state_tracker
                state: "off"
            then:
              - service: switch.toggle
                target:
                  entity_id: "{{ switch_entity }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: "{{ tracker_entity }}"

      - conditions:
          - condition: trigger
            id: surplus_off
        sequence:
          - if:
              - condition: state
                entity_id: !input state_tracker
                state: "on"
            then:
              - service: switch.toggle
                target:
                  entity_id: "{{ switch_entity }}"
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ tracker_entity }}"
